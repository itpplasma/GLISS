name: macOS wheels

on:
  push:
    tags: ['v[0-9]*']
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  # The merge queue no longer builds wheels; nightly.yml calls this workflow.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: '15.0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'

# Only PR runs share a group; pending push and merge-group runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Native integration follows admission or an explicit development dispatch.
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')))) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
    runs-on: ${{ (startsWith(matrix.runner, 'windows') || contains(matrix.runner, 'intel') || matrix.runner == 'macos-13' || matrix.runner == 'macos-12') && matrix.runner || startsWith(matrix.runner, 'macos') && fromJSON('["self-hosted","macOS","ARM64","itp-macos"]') || contains(matrix.runner, '22.04') && fromJSON('["self-hosted","itp-ubuntu22"]') || fromJSON('["self-hosted","itp-ubuntu24"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the locked native toolchain
        uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        with:
          environment-file: ci/macos-${{ matrix.architecture }}.lock
          environment-name: gliss-build
          micromamba-version: 2.9.0-0
          generate-run-shell: true
          init-shell: none
      - name: Build and test the native library
        shell: micromamba-shell {0}
        run: ci/macos_wheel.sh "${{ matrix.architecture }}"
      - name: Retain repaired wheel and build provenance
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.architecture }}
          path: artifacts/
          if-no-files-found: error

  installed:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.9'
            architecture: arm64
            runner: macos-15
          - python: '3.10'
            architecture: arm64
            runner: macos-15
          - python: '3.11'
            architecture: arm64
            runner: macos-15
          - python: '3.12'
            architecture: arm64
            runner: macos-15
          - python: '3.13'
            architecture: arm64
            runner: macos-15
          - python: '3.14'
            architecture: arm64
            runner: macos-15
    runs-on: ${{ (startsWith(matrix.runner, 'windows') || contains(matrix.runner, 'intel') || matrix.runner == 'macos-13' || matrix.runner == 'macos-12') && matrix.runner || startsWith(matrix.runner, 'macos') && fromJSON('["self-hosted","macOS","ARM64","itp-macos"]') || contains(matrix.runner, '22.04') && fromJSON('["self-hosted","itp-ubuntu22"]') || fromJSON('["self-hosted","itp-ubuntu24"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up native private Python
        run: /opt/itp-ci-macos/setup-python.sh '${{ matrix.python }}'
      - uses: actions/download-artifact@v4
        with:
          name: macos-${{ matrix.architecture }}
          path: artifacts/
      - name: Test the installed wheel outside the checkout
        run: ci/macos_wheel_installed.sh "${{ matrix.architecture }}"

    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')))
  result:
    name: macOS wheels result
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')))) && (always())
    needs: [build, installed]
    runs-on:
      - self-hosted
      - itp-light
    steps:
      - name: Check wheel jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A wheel job failed or was cancelled; see the jobs above."
          exit 1
  build-informative:
    # Native integration follows admission or an explicit development dispatch.
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')))) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ (startsWith(matrix.runner, 'windows') || contains(matrix.runner, 'intel') || matrix.runner == 'macos-13' || matrix.runner == 'macos-12') && matrix.runner || startsWith(matrix.runner, 'macos') && fromJSON('["self-hosted","macOS","ARM64","itp-macos"]') || contains(matrix.runner, '22.04') && fromJSON('["self-hosted","itp-ubuntu22"]') || fromJSON('["self-hosted","itp-ubuntu24"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the locked native toolchain
        uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        with:
          environment-file: ci/macos-${{ matrix.architecture }}.lock
          environment-name: gliss-build
          micromamba-version: 2.9.0-0
          generate-run-shell: true
          init-shell: none
      - name: Build and test the native library
        shell: micromamba-shell {0}
        run: ci/macos_wheel.sh "${{ matrix.architecture }}"
      - name: Retain repaired wheel and build provenance
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.architecture }}
          path: artifacts/
          if-no-files-found: error

    continue-on-error: true
  installed-informative:
    needs:
      - build-informative
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.9'
            architecture: x86_64
            runner: macos-15-intel
          - python: '3.10'
            architecture: x86_64
            runner: macos-15-intel
          - python: '3.11'
            architecture: x86_64
            runner: macos-15-intel
          - python: '3.12'
            architecture: x86_64
            runner: macos-15-intel
          - python: '3.13'
            architecture: x86_64
            runner: macos-15-intel
          - python: '3.14'
            architecture: x86_64
            runner: macos-15-intel
    runs-on: ${{ (startsWith(matrix.runner, 'windows') || contains(matrix.runner, 'intel') || matrix.runner == 'macos-13' || matrix.runner == 'macos-12') && matrix.runner || startsWith(matrix.runner, 'macos') && fromJSON('["self-hosted","macOS","ARM64","itp-macos"]') || contains(matrix.runner, '22.04') && fromJSON('["self-hosted","itp-ubuntu22"]') || fromJSON('["self-hosted","itp-ubuntu24"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture == 'arm64' && 'arm64' || 'x64' }}
      - uses: actions/download-artifact@v4
        with:
          name: macos-${{ matrix.architecture }}
          path: artifacts/
      - name: Test the installed wheel outside the checkout
        run: ci/macos_wheel_installed.sh "${{ matrix.architecture }}"

    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')))
    continue-on-error: true
