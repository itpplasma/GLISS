name: macOS wheels

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: "15.0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
          - runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the locked native toolchain
        uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        with:
          environment-file: ci/macos-${{ matrix.architecture }}.lock
          environment-name: gliss-build
          micromamba-version: "2.9.0-0"
          generate-run-shell: true
          init-shell: none
      - name: Build and test the native library
        shell: micromamba-shell {0}
        run: |
          test "$(uname -m)" = "${{ matrix.architecture }}"
          export MACOSX_DEPLOYMENT_TARGET=15.0
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export CMAKE_PREFIX_PATH="$CONDA_PREFIX"
          export PKG_CONFIG_PATH="$CONDA_PREFIX/lib/pkgconfig"
          python -m pip install build==1.3.0 delocate==0.13.0 twine==6.2.0 scipy
          mkdir -p artifacts
          micromamba list --explicit > artifacts/toolchain.lock
          python -m pip freeze > artifacts/python-build.txt
          cp pyproject.toml artifacts/build-metadata.toml
          "$FC" --version > artifacts/fortran.txt
          sw_vers > artifacts/macos.txt
          xcodebuild -version > artifacts/xcode.txt
          cmake -S . -B build -G Ninja -DGLISS_REQUIRE_OPENBLAS=ON
          cmake --build build --parallel 3
          ctest --test-dir build --output-on-failure
          build/gliss_wheel_fixture artifacts/installed_wheel_fixture.nc
          python -m build --wheel
          delocate-wheel --require-archs "${{ matrix.architecture }}" \
            --sanitize-rpaths -w artifacts dist/*.whl
          delocate-listdeps --all artifacts/*.whl > artifacts/dependencies.txt
          python -m twine check artifacts/*.whl
      - name: Retain repaired wheel and build provenance
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.architecture }}
          path: artifacts/
          if-no-files-found: error

  installed:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        architecture: [x86_64, arm64]
        include:
          - runner: macos-15-intel
            architecture: x86_64
          - runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture == 'arm64' && 'arm64' || 'x64' }}
      - uses: actions/download-artifact@v4
        with:
          name: macos-${{ matrix.architecture }}
          path: artifacts/
      - name: Test the installed wheel outside the checkout
        run: |
          unset GLISS_LIB PYTHONPATH
          for loader_variable in ${!DYLD_@}; do unset "$loader_variable"; done
          python -m venv "$RUNNER_TEMP/gliss-wheel"
          python_exe="$RUNNER_TEMP/gliss-wheel/bin/python"
          "$python_exe" -m pip install artifacts/*.whl pytest scipy
          "$python_exe" -m pip check
          cd "$RUNNER_TEMP"
          "$python_exe" "$GITHUB_WORKSPACE/ci/check_macos_wheel.py" \
            --architecture "${{ matrix.architecture }}" \
            --c-consumer "$GITHUB_WORKSPACE/cmake/test_gliss_header.c"
          "$python_exe" "$GITHUB_WORKSPACE/ci/check_installed.py" \
            --tests "$GITHUB_WORKSPACE/python/tests" \
            --equilibrium "$GITHUB_WORKSPACE/artifacts/installed_wheel_fixture.nc"
