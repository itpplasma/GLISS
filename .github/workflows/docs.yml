name: docs

# Publishes the versioned documentation site through GitHub Pages: the
# default branch updates `latest`, a release tag vX.Y.Z adds its own
# directory once. The site is built from the installed wheel, never from the
# checkout, and every quickstart block runs against that wheel first. This
# gh-pages branch keeps the previously published versions. The complete site
# is deployed as a Pages artifact; token-authenticated branch pushes do not
# trigger GitHub's branch-based Pages builds. This workflow does not gate PRs.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  released-guides:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: v0.0.1
            commit: a2cfece6748bd03ea943aba75a3f14eeb9442bbb
          - tag: v0.0.2
            commit: b994f51aa9ebe1a5e03bad2c72c6fde730fcaa1b
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Check out the released package and guide
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.tag }}
          path: release-source
      - name: Install native and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake ninja-build \
            libopenblas-dev libnetcdf-dev pkg-config
          python -m pip install --upgrade pip build
      - name: Build and install the exact released package
        run: |
          test "$(git -C release-source rev-parse HEAD)" = "${{ matrix.commit }}"
          python -m build --wheel --outdir "$RUNNER_TEMP/release-wheel" release-source
          python -m venv "$RUNNER_TEMP/release-docs"
          "$RUNNER_TEMP/release-docs/bin/pip" install \
            "$RUNNER_TEMP"/release-wheel/*.whl sphinx myst-parser
      - name: Execute and build the historical guide
        run: |
          unset GLISS_LIB PYTHONPATH
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/release-docs/bin/python" \
            "$GITHUB_WORKSPACE/ci/build_release_docs.py" \
            --source "$GITHUB_WORKSPACE/release-source" \
            --tag "${{ matrix.tag }}" --commit "${{ matrix.commit }}" \
            --fixture "$GITHUB_WORKSPACE/test/data/solovev_q1.035.nc" \
            --switcher "$GITHUB_WORKSPACE/docs/_static/versions.js" \
            --output "$RUNNER_TEMP/release-html/${{ matrix.tag }}"
      - uses: actions/upload-artifact@v4
        with:
          name: docs-release-${{ matrix.tag }}
          path: ${{ runner.temp }}/release-html/
          if-no-files-found: error

  publish:
    needs: released-guides
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake ninja-build \
            liblapack-dev libnetcdf-dev pkg-config
          python -m pip install --upgrade pip build
      - name: Build the wheel
        run: python -m build --wheel
      - name: Install the wheel and documentation tools
        run: |
          python -m venv /tmp/docs
          /tmp/docs/bin/pip install dist/*.whl sphinx myst-parser pytest scipy "numpy<2" booz-xform==0.0.9
      - name: Run the documentation examples against the installed wheel
        run: |
          mkdir -p /tmp/docs-tests
          cp python/tests/conftest.py python/tests/test_docs.py /tmp/docs-tests/
          cd /tmp/docs-tests
          GLISS_LIB="$(/tmp/docs/bin/python -c \
            'import gliss; print(gliss._load_library()._name)')"
          export GLISS_LIB
          GLISS_DOCS="$GITHUB_WORKSPACE/docs" \
            GLISS_TEST_DATA="$GITHUB_WORKSPACE/test/data" \
            /tmp/docs/bin/python -m pytest -q -p no:cacheprovider .
      - name: Select the site version
        id: version
        run: |
          installed="$(/tmp/docs/bin/python -c 'import gliss; print(gliss.__version__)')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "v$installed" ] || {
              echo "tag $GITHUB_REF_NAME does not match package $installed"; exit 1; }
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Build HTML and check links from the installed package
        run: |
          cd /tmp
          /tmp/docs/bin/sphinx-build -W -b html "$GITHUB_WORKSPACE/docs" /tmp/html
          /tmp/docs/bin/sphinx-build -W -b linkcheck "$GITHUB_WORKSPACE/docs" \
            /tmp/linkcheck
      - name: Collect the tag-built release guides
        uses: actions/download-artifact@v4
        with:
          pattern: docs-release-*
          merge-multiple: true
          path: /tmp/release-docs
      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin gh-pages; then
            git worktree add /tmp/site FETCH_HEAD
            git -C /tmp/site checkout -B gh-pages
          else
            git worktree add --detach /tmp/site
            git -C /tmp/site checkout --orphan gh-pages
            git -C /tmp/site rm -rf --quiet --ignore-unmatch .
          fi
          python ci/publish_docs.py /tmp/html "${{ steps.version.outputs.name }}" \
            /tmp/site --releases /tmp/release-docs
          git -C /tmp/site add -A
          if git -C /tmp/site diff --cached --quiet; then
            echo "documentation unchanged"
          else
            git -C /tmp/site commit -m "Publish ${{ steps.version.outputs.name }} documentation for $GITHUB_SHA"
            git -C /tmp/site push origin gh-pages
          fi
          mkdir -p "$RUNNER_TEMP/pages"
          git -C /tmp/site archive HEAD | tar -x -C "$RUNNER_TEMP/pages"
      - name: Upload the complete versioned site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the versioned documentation site
        id: deployment
        uses: actions/deploy-pages@v4
