name: generated kernels

on:
  pull_request:
    paths:
      - CMakeLists.txt
      - cmake/**
      - gen/**
      - src/**
      - test/**
      - benchmarks/cas3d_envelope/symbolic_interpolation/**
      - benchmarks/cas3d_envelope/symbolic_metric/**
      - benchmarks/analytic/resonant_pinch/symbolic/**
      - benchmarks/analytic/sheared_pinch/symbolic/**
      - benchmarks/solovev/public/symbolic_derivative/**
      - benchmarks/qas3/symbolic_current/**
      - .github/workflows/generated-kernels.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  CCACHE_DIR: ${{ github.workspace }}/.codegen-ccache

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read the FortSym source pin
        id: pin
        run: |
          set -euo pipefail
          revision=$(cat gen/fortsym-revision.txt)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: lazy-fortran/fortsym
          ref: ${{ steps.pin.outputs.revision }}
          path: fortsym-src
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: gliss-codegen-nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('fortsym-src/flake.lock') }}
          restore-prefixes-first-match: gliss-codegen-nix-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 4G
      - uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gliss-codegen-ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('fortsym-src/flake.lock') }}-${{ steps.pin.outputs.revision }}
          restore-keys: |
            gliss-codegen-ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('fortsym-src/flake.lock') }}-
      - name: Extend the locked toolchain with GLISS dependencies
        run: |
          cat > .codegen-shell.nix <<'NIX'
          let
            fortsym = builtins.getFlake ("path:" + toString ./fortsym-src);
            system = builtins.currentSystem;
            pkgs = import fortsym.inputs.nixpkgs { inherit system; };
            runtimeLibraries = with pkgs; [
              symengine flint mpfr gmp libmpc netcdf openblas
              (lib.getLib gfortran.cc) (lib.getLib stdenv.cc.cc)
            ];
            runtimeClosure = pkgs.closureInfo { rootPaths = runtimeLibraries; };
          in pkgs.mkShell {
            inputsFrom = [ fortsym.devShells.${system}.default ];
            packages = [ pkgs.netcdf pkgs.openblas ];
            GLISS_CODEGEN_RUNTIME_LIBRARIES = pkgs.lib.makeLibraryPath runtimeLibraries;
            GLISS_CODEGEN_RUNTIME_ROOTS = pkgs.lib.concatStringsSep "\n"
              (map toString runtimeLibraries);
            GLISS_CODEGEN_RUNTIME_CLOSURE = "${runtimeClosure}/store-paths";
            GLISS_CODEGEN_LOADER = pkgs.stdenv.cc.bintools.dynamicLinker;
            GLISS_CODEGEN_NIXPKGS_REVISION = fortsym.inputs.nixpkgs.rev;
          }
          NIX
      - name: Build and install pinned FortSym
        run: |
          nix develop --impure --file .codegen-shell.nix --command bash -euo pipefail -c '
            test "$(git -C fortsym-src rev-parse HEAD)" = "$(cat gen/fortsym-revision.txt)"
            {
              git rev-parse HEAD
              git -C fortsym-src rev-parse HEAD
              printf "nixpkgs=%s\n" "$GLISS_CODEGEN_NIXPKGS_REVISION"
              sha256sum fortsym-src/flake.lock
              command -v gfortran
              gfortran --version
              gfortran -dumpmachine
              sha256sum "$(gfortran -print-prog-name=f951)"
              cmake --version
            } > codegen-provenance.txt
            cmake -S fortsym-src -B fortsym-build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_Fortran_COMPILER=gfortran \
              -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/fortsym-prefix" \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DFORTSYM_BUILD_TESTING=OFF -DFORTSYM_ENABLE_YACAS=OFF
            cmake --build fortsym-build --parallel 2
            cmake --install fortsym-build
          '
      - name: Build native generators and check exact reproduction
        run: |
          nix develop --impure --file .codegen-shell.nix --command bash -euo pipefail -c '
            library_path="$GITHUB_WORKSPACE/fortsym-prefix/lib:$GLISS_CODEGEN_RUNTIME_LIBRARIES"
            # Dependency RUNPATHs resolve the remaining closure. Exposing every
            # closure /lib would inject Nix libc into host interpreter scripts.
            export LD_LIBRARY_PATH="$library_path"
            {
              printf "Declared Nix runtime roots:\n%s\n" "$GLISS_CODEGEN_RUNTIME_ROOTS"
              printf "Transitive Nix runtime closure:\n"
              cat "$GLISS_CODEGEN_RUNTIME_CLOSURE"
              printf "Resolved library search path:\n%s\n" "$LD_LIBRARY_PATH"
              printf "Pinned ELF interpreter:\n%s\n" "$GLISS_CODEGEN_LOADER"
            } > codegen-runtime-provenance.txt
            cmake -S . -B build-codegen -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=gfortran \
              -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/fortsym-prefix" \
              -DGLISS_ENABLE_CODEGEN=ON -DGLISS_REQUIRE_OPENBLAS=ON
            cmake --build build-codegen --parallel 2 --target \
              gliss_physical_mass_gen gliss_pressure_adjoint_gen gliss_energy_gen \
              gliss_geometry_gen gliss_cartesian_field_gen gliss_weighted_feec_gen
            for generator in physical_mass pressure_adjoint energy geometry cartesian_field weighted_feec; do
              printf "\nLoader dependencies: %s\n" "$generator" >> codegen-runtime-provenance.txt
              "$GLISS_CODEGEN_LOADER" --library-path "$library_path" \
                --list "build-codegen/gliss_${generator}_gen" \
                >> codegen-runtime-provenance.txt 2>&1
            done
            if grep -q "=> not found" codegen-runtime-provenance.txt; then
              cat codegen-runtime-provenance.txt
              exit 1
            fi
            cmake --build build-codegen --target gliss_check_generated --parallel 2
            ctest --test-dir build-codegen -L codegen --output-on-failure
          '
      - name: Check symbolic source contracts
        run: |
          nix develop --impure --file .codegen-shell.nix --command bash -euo pipefail -c '
            export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/fortsym-prefix/lib:$GLISS_CODEGEN_RUNTIME_LIBRARIES"
            for proof in symbolic_interpolation symbolic_metric; do
              cmake -S "benchmarks/cas3d_envelope/$proof/src" -B "build-$proof" -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=gfortran \
                -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/fortsym-prefix"
              cmake --build "build-$proof" --parallel 2
              ctest --test-dir "build-$proof" --output-on-failure
            done
          '
      - name: Check resonant pinch symbolic derivation
        run: |
          nix develop --impure --file .codegen-shell.nix --command bash -euo pipefail -c '
            export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/fortsym-prefix/lib:$GLISS_CODEGEN_RUNTIME_LIBRARIES"
            cmake -S benchmarks/analytic/resonant_pinch/symbolic/src \
              -B build-symbolic_resonant_pinch -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=gfortran \
              -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/fortsym-prefix"
            cmake --build build-symbolic_resonant_pinch --parallel 2
            ctest --test-dir build-symbolic_resonant_pinch --output-on-failure
          '
      - name: Check sheared pinch marginal coefficients
        run: |
          nix develop --impure --file .codegen-shell.nix --command bash -euo pipefail -c '
            export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/fortsym-prefix/lib:$GLISS_CODEGEN_RUNTIME_LIBRARIES"
            cmake -S benchmarks/analytic/sheared_pinch/symbolic/src \
              -B build-symbolic_sheared_pinch -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=gfortran \
              -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/fortsym-prefix"
            cmake --build build-symbolic_sheared_pinch --parallel 2
            ctest --test-dir build-symbolic_sheared_pinch --output-on-failure
          '
      - name: Check weighted derivative-space identities
        run: |
          nix develop --impure --file .codegen-shell.nix --command bash -euo pipefail -c '
            export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/fortsym-prefix/lib:$GLISS_CODEGEN_RUNTIME_LIBRARIES"
            cmake -S benchmarks/solovev/public/symbolic_derivative/src \
              -B build-symbolic_derivative -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=gfortran \
              -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/fortsym-prefix"
            cmake --build build-symbolic_derivative --parallel 2
            ctest --test-dir build-symbolic_derivative --output-on-failure
          '
      - name: Check exact free-boundary identities
        run: |
          nix develop --impure --file .codegen-shell.nix --command bash -euo pipefail -c '
            export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/fortsym-prefix/lib:$GLISS_CODEGEN_RUNTIME_LIBRARIES"
            cmake -S gen/free_boundary -B build-free-boundary-proof -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=gfortran \
              -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/fortsym-prefix"
            cmake --build build-free-boundary-proof --parallel 2
            ctest --test-dir build-free-boundary-proof --output-on-failure
          '
      - name: Check reference-current response identities
        run: |
          nix develop --impure --file .codegen-shell.nix --command bash -euo pipefail -c '
            export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/fortsym-prefix/lib:$GLISS_CODEGEN_RUNTIME_LIBRARIES"
            cmake -S benchmarks/qas3/symbolic_current/src \
              -B build-symbolic_current -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=gfortran \
              -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/fortsym-prefix"
            cmake --build build-symbolic_current --parallel 2
            ctest --test-dir build-symbolic_current --output-on-failure
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-kernel-evidence
          path: |
            codegen-provenance.txt
            codegen-runtime-provenance.txt
            gen/fortsym-revision.txt
            fortsym-src/flake.lock
            build-free-boundary-proof/identities.json
            build-free-boundary-proof/Testing/Temporary/LastTest.log
            build-codegen/generated-kernels/
            build-codegen/Testing/Temporary/LastTest.log
            build-symbolic_interpolation/strict-identities.json
            build-symbolic_interpolation/Testing/Temporary/LastTest.log
            build-symbolic_metric/strict-identities.json
            build-symbolic_metric/Testing/Temporary/LastTest.log
            build-symbolic_resonant_pinch/strict-identities.json
            build-symbolic_resonant_pinch/Testing/Temporary/LastTest.log
            build-symbolic_sheared_pinch/strict-identities.json
            build-symbolic_sheared_pinch/Testing/Temporary/LastTest.log
            build-symbolic_derivative/strict-identities.json
            build-symbolic_derivative/Testing/Temporary/LastTest.log
            build-symbolic_current/strict-identities.json
            build-symbolic_current/Testing/Temporary/LastTest.log
          if-no-files-found: warn
