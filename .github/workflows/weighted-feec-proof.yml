name: weighted FEEC proof

on:
  pull_request:
    paths:
      - benchmarks/feec/lean/**
      - .github/workflows/weighted-feec-proof.yml
  workflow_dispatch:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: benchmarks/feec/lean
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            benchmarks/feec/lean/.lake/packages
          key: weighted-feec-lean-${{ runner.os }}-${{ hashFiles('benchmarks/feec/lean/lean-toolchain', 'benchmarks/feec/lean/lake-manifest.json') }}
      - name: Install elan from a pinned bootstrap source
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL \
            https://raw.githubusercontent.com/leanprover/elan/58e8d545e33641f66dbcbd22c4283109e71757be/elan-init.sh \
            -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the pinned mathematics cache
        run: |
          lake exe cache get Mathlib/LinearAlgebra/FiniteDimensional.lean \
            Mathlib/LinearAlgebra/Dimension/Constructions.lean \
            Mathlib/Algebra/Polynomial/Derivative.lean Mathlib/Tactic.lean
      - name: Check the weighted FEEC theorems
        run: lake build
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
