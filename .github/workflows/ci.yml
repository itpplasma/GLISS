name: ci

on:
  push:
    tags: ['v[0-9]*']
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  merge_group:
  workflow_dispatch:

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'

jobs:
  gfortran:
    runs-on: ${{ github.event.pull_request.head.repo.fork && fromJSON('["self-hosted","itp-ubuntu24"]') || (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && fromJSON('["self-hosted","itp-slurm"]') || fromJSON('["self-hosted","itp-build"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run native checks in the build container
        if: ${{ !github.event.pull_request.head.repo.fork && !(github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        run: |-
          ci/run.sh ci-gfortran
      - name: Bundle exact sources for Slurm
        if: ${{ !github.event.pull_request.head.repo.fork && (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        env:
          SCI_TIER: ci-gfortran
        run: |-
          TMPDIR="$RUNNER_TEMP" ci/bundle.sh "$RUNNER_TEMP/ci.tar.zst"
      - name: Run native checks on sCluster
        if: ${{ !github.event.pull_request.head.repo.fork && (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        run: |-
          sci-dispatch native "$RUNNER_TEMP/ci.tar.zst"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake ninja-build \
            liblapack-dev libnetcdf-dev pkg-config
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Configure
        run: cmake -S . -B build -G Ninja
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Build
        run: cmake --build build
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Test
        run: ctest --test-dir build --output-on-failure

        if: ${{ github.event.pull_request.head.repo.fork }}
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
  sparse:
    runs-on: ${{ github.event.pull_request.head.repo.fork && fromJSON('["self-hosted","itp-ubuntu24"]') || (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && fromJSON('["self-hosted","itp-slurm"]') || fromJSON('["self-hosted","itp-build"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run native checks in the build container
        if: ${{ !github.event.pull_request.head.repo.fork && !(github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        run: |-
          ci/run.sh ci-sparse
      - name: Bundle exact sources for Slurm
        if: ${{ !github.event.pull_request.head.repo.fork && (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        env:
          SCI_TIER: ci-sparse
        run: |-
          TMPDIR="$RUNNER_TEMP" ci/bundle.sh "$RUNNER_TEMP/ci.tar.zst"
      - name: Run native checks on sCluster
        if: ${{ !github.event.pull_request.head.repo.fork && (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        run: |-
          sci-dispatch native "$RUNNER_TEMP/ci.tar.zst"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake ninja-build libopenblas-dev \
            libnetcdf-dev libsuitesparse-dev pkg-config
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Configure native sparse consumer
        run: |
          cmake -S . -B build -G Ninja -DGLISS_ENABLE_FORTSPARSE=ON \
            -DGLISS_REQUIRE_OPENBLAS=ON
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Build and test sparse path
        run: |
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

        if: ${{ github.event.pull_request.head.repo.fork }}
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
  gfortran-runtime:
    runs-on: ${{ github.event.pull_request.head.repo.fork && fromJSON('["self-hosted","itp-ubuntu24"]') || (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && fromJSON('["self-hosted","itp-slurm"]') || fromJSON('["self-hosted","itp-build"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run native checks in the build container
        if: ${{ !github.event.pull_request.head.repo.fork && !(github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        run: |-
          ci/run.sh ci-gfortran-runtime
      - name: Bundle exact sources for Slurm
        if: ${{ !github.event.pull_request.head.repo.fork && (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        env:
          SCI_TIER: ci-gfortran-runtime
        run: |-
          TMPDIR="$RUNNER_TEMP" ci/bundle.sh "$RUNNER_TEMP/ci.tar.zst"
      - name: Run native checks on sCluster
        if: ${{ !github.event.pull_request.head.repo.fork && (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        run: |-
          sci-dispatch native "$RUNNER_TEMP/ci.tar.zst"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake ninja-build \
            libopenblas-dev libnetcdf-dev pkg-config
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Configure with runtime checks
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_Fortran_COMPILER=gfortran \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_Fortran_FLAGS_DEBUG="-O1 -g -fcheck=all -fbacktrace" \
            -DGLISS_REQUIRE_OPENBLAS=ON
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Build
        run: cmake --build build --parallel 2
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Test with runtime checks
        run: ctest --test-dir build --output-on-failure

        if: ${{ github.event.pull_request.head.repo.fork }}
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
  lint:
    runs-on: ${{ github.event.pull_request.head.repo.fork && fromJSON('["self-hosted","itp-ubuntu24"]') || (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && fromJSON('["self-hosted","itp-slurm"]') || fromJSON('["self-hosted","itp-build"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run native checks in the build container
        if: ${{ !github.event.pull_request.head.repo.fork && !(github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        run: |-
          ci/run.sh ci-lint
      - name: Bundle exact sources for Slurm
        if: ${{ !github.event.pull_request.head.repo.fork && (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        env:
          SCI_TIER: ci-lint
        run: |-
          TMPDIR="$RUNNER_TEMP" ci/bundle.sh "$RUNNER_TEMP/ci.tar.zst"
      - name: Run native checks on sCluster
        if: ${{ !github.event.pull_request.head.repo.fork && (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        run: |-
          sci-dispatch native "$RUNNER_TEMP/ci.tar.zst"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake ninja-build \
            liblapack-dev libnetcdf-dev pkg-config
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Configure with warnings as errors
        run: cmake -S . -B build -G Ninja -DCMAKE_Fortran_FLAGS=-Werror
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Build
        run: cmake --build build

        if: ${{ github.event.pull_request.head.repo.fork }}
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
  format:
    runs-on:
      - self-hosted
      - itp-ubuntu24
    steps:
      - uses: actions/checkout@v4
      - name: Install fprettify
        run: pip install fprettify
      - name: Format check (informational)
        # Canonical formatting is `fo fmt` (native formatter; this repo has
        # no .fprettify.rc, so fo does not fall back to fprettify). fo is a
        # group-internal tool and is not installed in public CI. Stock
        # fprettify also cannot reproduce this repo's style: it forces no
        # space around `//` and a mandatory space before a bare
        # continuation `&`, both used throughout this tree. So this job
        # reports drift for visibility without gating the build.
        continue-on-error: true
        run: |
          diff="$(fprettify --line-length 88 --indent 4 --diff --recursive src app test)"
          if [ -n "$diff" ]; then
            echo "$diff"
            echo "::warning::fprettify reports formatting drift (informational only)"
            exit 1
          fi

    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
  python:
    runs-on: ${{ github.event.pull_request.head.repo.fork && fromJSON('["self-hosted","itp-ubuntu24"]') || (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && fromJSON('["self-hosted","itp-slurm"]') || fromJSON('["self-hosted","itp-build"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run native checks in the build container
        if: ${{ !github.event.pull_request.head.repo.fork && !(github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        run: |-
          ci/run.sh ci-python
      - name: Bundle exact sources for Slurm
        if: ${{ !github.event.pull_request.head.repo.fork && (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        env:
          SCI_TIER: ci-python
        run: |-
          TMPDIR="$RUNNER_TEMP" ci/bundle.sh "$RUNNER_TEMP/ci.tar.zst"
      - name: Run native checks on sCluster
        if: ${{ !github.event.pull_request.head.repo.fork && (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        run: |-
          sci-dispatch native "$RUNNER_TEMP/ci.tar.zst"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake ninja-build \
            liblapack-dev libnetcdf-dev pkg-config
          python -m pip install --upgrade pip
          pip install build "numpy<2" pytest scipy booz-xform==0.0.9
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Build shared library
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build --target gliss_c gliss_wheel_fixture
          build/gliss_wheel_fixture build/installed_wheel_fixture.nc
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Run Python binding tests
        # Most tests are contract tests against a fake library. Tests marked
        # native load the built libgliss_c and check it against independent
        # oracles (test/data Solov'ev fixtures); they fail without it. The
        # golden and simsopt tests skip without the LFS fixtures / simsopt.
        run: GLISS_LIB=$PWD/build/libgliss_c.so python -m pytest python/tests -v
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Check the public analytic equilibrium generator
        run: python benchmarks/solovev/public/test_solovev.py
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Build distributions
        run: python -m build
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Test installed wheel
        run: |
          python -m venv /tmp/gliss-wheel
          /tmp/gliss-wheel/bin/pip install "$(echo dist/*.whl)[vmec]" pytest
          /tmp/gliss-wheel/bin/pip check
          /tmp/gliss-wheel/bin/python ci/check_installed.py \
            --tests python/tests --equilibrium build/installed_wheel_fixture.nc
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Test installed sdist
        run: |
          python -m venv /tmp/gliss-sdist
          /tmp/gliss-sdist/bin/pip install dist/gliss-*.tar.gz
          /tmp/gliss-sdist/bin/pip check
          cd /tmp
          /tmp/gliss-sdist/bin/python - <<'PY'
          from pathlib import Path
          import gliss

          assert gliss.version() == gliss.__version__ == "0.0.3"
          assert (Path(gliss.get_include()) / "gliss.h").is_file()
          PY

        if: ${{ github.event.pull_request.head.repo.fork }}
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
  flang:
    runs-on:
      - self-hosted
      - itp-ubuntu24
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 22 (flang)
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y flang-22 libomp-22-dev
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build \
            liblapack-dev libnetcdf-dev pkg-config
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_Fortran_COMPILER=flang-22 \
            -DOpenMP_Fortran_FLAGS=-fopenmp \
            -DOpenMP_Fortran_LIB_NAMES=omp \
            -DOpenMP_omp_LIBRARY=/usr/lib/llvm-22/lib/libomp.so
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Opt-in derivative-verification job: builds the Enzyme LLVM plugin from
  # source against LLVM 22 and runs GLISS's enzyme_* differentiation tests.
  # Enzyme is not apt-installable and a from-source build takes tens of
  # minutes, so this must never run on push/pull_request. Trigger manually
  # from the Actions tab (workflow_dispatch) when Enzyme-covered code changes.
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
  enzyme:
    if: >-
      (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')) && (github.event_name == 'workflow_dispatch')
    runs-on:
      - self-hosted
      - itp-ubuntu24
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 22 (flang, opt, llvm-link, dev headers)
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y flang-22 libomp-22-dev llvm-22-dev libzstd-dev
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++ \
            liblapack-dev libnetcdf-dev pkg-config
      - name: Build Enzyme plugin
        run: |
          # Pinned to the latest EnzymeAD/Enzyme release at the time this
          # job was written (2026-07-10). Must track a version that builds
          # against LLVM 22 to match the flang-22 front end below --
          # cmake/EnzymeFortran.cmake requires opt/llvm-link's LLVM major
          # version to equal the flang major version. Bump this tag if
          # LLVM 22 support requires a newer Enzyme release.
          git clone --branch v0.0.281 --depth 1 \
            https://github.com/EnzymeAD/Enzyme.git enzyme-src
          cmake -S enzyme-src/enzyme -B enzyme-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm
          cmake --build enzyme-build --target LLVMEnzyme-22
      - name: Configure with Enzyme
        env:
          ENZYME_PLUGIN: ${{ github.workspace }}/enzyme-build/Enzyme/LLVMEnzyme-22.so
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_Fortran_COMPILER=flang-22 \
            -DOpenMP_Fortran_FLAGS=-fopenmp \
            -DOpenMP_Fortran_LIB_NAMES=omp \
            -DOpenMP_omp_LIBRARY=/usr/lib/llvm-22/lib/libomp.so \
            -DGLISS_ENABLE_ENZYME=ON
      - name: Build
        run: cmake --build build
      - name: Test Enzyme derivatives
        run: ctest --test-dir build -R enzyme --output-on-failure
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
